name: Bug report
description: A result is wrong, an exception is thrown, or a result is invalid.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest input that shows the problem, ideally as WKT, plus the call (algorithm and parameters). A fixture in the format of `samples/README.md` is perfect.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpatialNET version
      placeholder: 0.1.0-preview.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: .NET version and operating system.
      placeholder: .NET 10.0, Windows 11
  - type: textarea
    id: host
    attributes:
      label: Geometry implementation
      description: Do you use the reference implementation (`SpatialNET.Imp`) or your own geometry classes and factory? Does it also happen with the reference implementation?

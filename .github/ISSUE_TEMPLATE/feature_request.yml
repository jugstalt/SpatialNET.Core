name: Feature request
description: Suggest a new algorithm, option or documentation improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the use case rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work (API, behavior for empty or invalid input, precision)? Reference implementations such as JTS/NetTopologySuite or standards are helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What do you do today, and what did you consider?

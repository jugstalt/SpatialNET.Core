name: Stress tests

# The stress tests (tests/SpatialNET.Tests/Stress) throw many random, deliberately dirty inputs at the algorithms and
# check invariants and, where NTS has the same meaning, the answer of NTS. They take minutes and are no part of the
# normal run. A failing case prints a CsCheck seed that can be replayed locally (see tools/stress.ps1).
on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Time budget per stress test in seconds
        default: '300'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPATIALNET_STRESS: '1'
      SPATIALNET_STRESS_SECONDS: ${{ inputs.seconds || '300' }}
      SPATIALNET_STRESS_ITER: '1000000'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Stress tests
        run: dotnet test tests/SpatialNET.Tests -c Release --filter "Category=Stress"
